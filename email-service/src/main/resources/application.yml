server:
  port: ${EMAIL_SERVICE_PORT:${SERVER_PORT:8082}}
  servlet:
    context-path: /

spring:
  application:
    name: email-service

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tripgrid}
    password: ${RABBITMQ_PASSWORD:tripgrid_secret}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false

tripgrid:
  mail:
    from: ${MAIL_FROM:no-reply@tripgrid.com}
    from-name: "TripGrid"
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:tripgrid.events}
    dlx: tripgrid.events.dlx
    queues:
      user-registered: email.user-registered
      verification: email.verification
      dlq: email.dlq
    routing-keys:
      user-registered: user.registered
      verification-requested: email.verification.requested
      dlq: email.dead-letter

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.paranietharan.tripgrid.email: DEBUG
