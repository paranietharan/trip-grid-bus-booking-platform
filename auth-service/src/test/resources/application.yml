spring:
  application:
    name: auth-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672

tripgrid:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    issuer: tripgrid-auth-service
  rabbitmq:
    exchange: tripgrid.events
    routing-keys:
      user-registered: user.registered
      verification-requested: email.verification.requested
  verification:
    code-expiration-minutes: 10
    max-resend-attempts: 3
    resend-window-minutes: 15
  seed:
    enabled: false
