server:
  port: ${AUTH_SERVICE_PORT:${SERVER_PORT:8081}}
  servlet:
    context-path: /

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${AUTH_DB_PORT:${DB_PORT:5432}}/${AUTH_DB_NAME:${DB_NAME:tripgrid_auth}}
    username: ${DB_USERNAME:tripgrid}
    password: ${DB_PASSWORD:tripgrid_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tripgrid}
    password: ${RABBITMQ_PASSWORD:tripgrid_secret}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2.0

tripgrid:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 mins
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days
    issuer: tripgrid-auth-service
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:tripgrid.events}
    routing-keys:
      user-registered: user.registered
      verification-requested: email.verification.requested
  verification:
    code-expiration-minutes: 10
    max-resend-attempts: 3
    resend-window-minutes: 15
  seed:
    enabled: ${SEED_DATA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.paranietharan.tripgrid.auth: DEBUG
    org.springframework.security: INFO
