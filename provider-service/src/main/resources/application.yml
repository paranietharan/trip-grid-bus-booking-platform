server:
  port: ${PROVIDER_SERVICE_PORT:${SERVER_PORT:8083}}
  servlet:
    context-path: /

spring:
  application:
    name: provider-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${PROVIDER_DB_PORT:5433}/${PROVIDER_DB_NAME:tripgrid_provider}
    username: ${DB_USERNAME:tripgrid}
    password: ${DB_PASSWORD:tripgrid_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

tripgrid:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    issuer: tripgrid-auth-service
  seed:
    enabled: ${SEED_DATA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.paranietharan.tripgrid.provider: DEBUG
    org.springframework.security: INFO
