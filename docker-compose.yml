services:
  # ------------------------------------------------------------
  # Microservice PostgreSQL Databases (Isolated on separate ports)
  # ------------------------------------------------------------
  postgres-auth:
    image: postgres:16-alpine
    container_name: tripgrid-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-tripgrid_auth}
      POSTGRES_USER: ${DB_USERNAME:-tripgrid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripgrid_secret}
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tripgrid} -d ${AUTH_DB_NAME:-tripgrid_auth}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-provider:
    image: postgres:16-alpine
    container_name: tripgrid-postgres-provider
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROVIDER_DB_NAME:-tripgrid_provider}
      POSTGRES_USER: ${DB_USERNAME:-tripgrid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripgrid_secret}
    ports:
      - "${PROVIDER_DB_PORT:-5433}:5432"
    volumes:
      - postgres_provider_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tripgrid} -d ${PROVIDER_DB_NAME:-tripgrid_provider}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-booking:
    image: postgres:16-alpine
    container_name: tripgrid-postgres-booking
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME:-tripgrid_booking}
      POSTGRES_USER: ${DB_USERNAME:-tripgrid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripgrid_secret}
    ports:
      - "${BOOKING_DB_PORT:-5434}:5432"
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tripgrid} -d ${BOOKING_DB_NAME:-tripgrid_booking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    container_name: tripgrid-postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-tripgrid_payment}
      POSTGRES_USER: ${DB_USERNAME:-tripgrid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripgrid_secret}
    ports:
      - "${PAYMENT_DB_PORT:-5435}:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tripgrid} -d ${PAYMENT_DB_NAME:-tripgrid_payment}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Redis Cache & Temporary State
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tripgrid-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -z "$$REDIS_PASSWORD" ]; then
               redis-server;
             else
               redis-server --requirepass "$$REDIS_PASSWORD";
             fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # RabbitMQ Event Broker
  # ------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tripgrid-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-tripgrid}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tripgrid_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Mailpit Mock SMTP Server & Web UI
  # ------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: tripgrid-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

volumes:
  postgres_auth_data:
    driver: local
  postgres_provider_data:
    driver: local
  postgres_booking_data:
    driver: local
  postgres_payment_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
